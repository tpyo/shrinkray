apiVersion: v1
kind: ConfigMap
metadata:
  name: shrinkray
  namespace: default
data:
  config.json: |
    {
      "server_address": "0.0.0.0:9000",
      "management_address": "0.0.0.0:9001",
      "read_timeout": 5,
      "proxies": [],
      "s3": {
          "access_key_id": "",
          "secret_access_key": "",
          "region": "us-east-1"
      },
      "routing": [
          {
              "path": "files/{*path}",
              "endpoint": "http://example.com/files/"
          },
          {
              "path": "{*path}",
              "endpoint": "s3://bucket-name/"
          }
      ]
    }

