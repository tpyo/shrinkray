---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: shrinkray
  name: shrinkray
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: shrinkray
  name: shrinkray-clusterrole
rules: []
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: shrinkray-clusterrolebinding
  labels:
    app: shrinkray
subjects:
  - kind: ServiceAccount
    name: shrinkray
    namespace: default
roleRef:
  kind: ClusterRole
  name: shrinkray-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shrinkray
  labels:
    app: shrinkray
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shrinkray
subjects:
  - kind: ServiceAccount
    name: shrinkray
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shrinkray
  labels:
    app: shrinkray
rules: []
---
apiVersion: v1
kind: Service
metadata:
  name: shrinkray
  namespace: default
  labels:
    app: shrinkray
spec:
  type: NodePort
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: http
  selector:
    app: shrinkray
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shrinkray
  labels:
    app: shrinkray
spec:
  selector:
    matchLabels:
      app: shrinkray
  template:
    metadata:
      labels:
        app: shrinkray
    spec:
      volumes:
        - name: config-file
          configMap:
            name: shrinkray
      containers:
        - name: shrinkray
          image: ghcr.io/tpyo/shrinkray/server:latest
          ports:
            - containerPort: 9000
              name: shrinkray
          volumeMounts:
          - name: config-file
            mountPath: /opt/shrinkray/etc/config.json
            subPath: config.json
          args: ["/opt/shrinkray/etc/config.json"]
          resources:
            requests:
              memory: 2000Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9001
            initialDelaySeconds: 2
            timeoutSeconds: 5
            periodSeconds: 5
          readinessProbe:
            successThreshold: 1
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: 9001
            timeoutSeconds: 2
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsGroup: 65534
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
---

