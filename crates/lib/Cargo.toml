[package]
name = "shrinkray"
version = "1.0.1"
edition = "2024"
rust-version = "1.89.0"

[lib]
name = "shrinkray"
path = "src/lib.rs"

[dependencies]
hex = "0.4.3"
libvips = "1.7.1"
rexif = "0.7.5"
ring = "0.17.14"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1.41"

[dev-dependencies]
rstest = "0.26.1"
