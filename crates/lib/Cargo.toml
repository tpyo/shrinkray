[package]
name = "shrinkray"
version = "1.0.1"
edition = "2024"
rust-version = "1.90.0"
authors = ["Don Schonknecht <don@tpyo.net>"]
build = "build.rs"
exclude = ["tests/*"]
keywords = [
    "libvips",
    "image",
    "resize",
    "thumbnail",
    "webp",
    "jpeg",
    "png",
    "avif",
]

[lib]
name = "shrinkray"
path = "src/lib.rs"

[dependencies]
hex = "0.4.3"
libvips = "1.7.1"
once_cell = "1.21.3"
rexif = "0.7.5"
ring = "0.17.14"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1.41"

[dev-dependencies]
axum = { version = "0.8.1", default-features = false, features = ["query"] }
rstest = "0.26.1"
