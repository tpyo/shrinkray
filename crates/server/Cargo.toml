[package]
name = "shrinkray-server"
version = "1.0.9"
edition = "2024"
publish = false
rust-version = "1.90.0"
authors = ["Don Schonknecht <don@tpyo.net>"]
build = "../lib/build.rs"

[[bin]]
name = "shrinkray"
path = "src/main.rs"

[dependencies]
shrinkray = { path = "../lib" }

async-trait = "0.1.89"
aws-sign-v4 = "0.3.0"
axum = { version = "0.8.9", default-features = false, features = [
    "tokio",
    "http1",
    "query",
    "matched-path",
    "macros",
    "tracing",
] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
chrono = "0.4.44"
headers = "0.4"
hex = "0.4.3"
libvips = "1.7.3"
metrics = { version = "0.24.3", default-features = false }
metrics-exporter-prometheus = { version = "0.18.1", default-features = false }
once_cell = "1.21.4"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
rayon = "1.11.0"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rexif = "0.7.5"
ring = "0.17.14"
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", default-features = false, features = ["full"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-logfmt = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"

[dev-dependencies]
axum-test = "20.0.0"
mockito = "1.7.2"
regex = "1.12.3"
tracing-test = "0.2.6"
