name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "README.md"
      - "docker/Dockerfile.base-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm64' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - { name: slim-bookworm, dockerfile: Dockerfile.slim-bookworm, suffix: "" }
          - { name: alpine, dockerfile: Dockerfile.alpine, suffix: "-alpine" }
        platform:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add metadata to Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=branch,suffix=${{ matrix.variant.suffix }}
            type=raw,value=latest${{ matrix.variant.suffix }},enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.suffix }}
            type=sha,suffix=${{ matrix.variant.suffix }}
          flavor: |
            latest=false

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.variant.name }} - ${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./docker/${{ matrix.variant.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}-${{ matrix.platform }}
          provenance: false

  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/base:latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        env:
          SHRINKRAY_LIB_PATH: /opt/shrinkray/lib
