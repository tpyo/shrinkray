name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: slim-bookworm, dockerfile: Dockerfile.slim-bookworm, suffix: "" }
          - { name: alpine, dockerfile: Dockerfile.alpine, suffix: "-alpine" }
        platform:
          - { name: amd64, runner: ubuntu-latest, docker: linux/amd64 }
          - { name: arm64, runner: ubuntu-24.04-arm, docker: linux/arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Build and push (${{ matrix.variant.name }}, ${{ matrix.platform.name }})
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./docker/${{ matrix.variant.dockerfile }}
          platforms: ${{ matrix.platform.docker }}
          tags: ghcr.io/${{ github.repository }}/server:${{ steps.short-sha.outputs.sha }}-${{ matrix.platform.name }}${{ matrix.variant.suffix }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}-${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}-${{ matrix.platform.name }}
          provenance: false

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - { name: slim-bookworm, suffix: "" }
          - { name: alpine, suffix: "-alpine" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Add metadata to Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=branch,suffix=${{ matrix.variant.suffix }}
            type=raw,value=latest${{ matrix.variant.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.suffix }}
            type=sha,suffix=${{ matrix.variant.suffix }}
          flavor: |
            latest=false

      - name: Create and push multi-arch manifest
        run: |
          TAG_FLAGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAG_FLAGS+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create \
            "${TAG_FLAGS[@]}" \
            "ghcr.io/${{ github.repository }}/server:${{ steps.short-sha.outputs.sha }}-amd64${{ matrix.variant.suffix }}" \
            "ghcr.io/${{ github.repository }}/server:${{ steps.short-sha.outputs.sha }}-arm64${{ matrix.variant.suffix }}"

  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/base:latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        env:
          SHRINKRAY_LIB_PATH: /opt/shrinkray/lib
